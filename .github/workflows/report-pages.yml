name: Build and Publish Report

on:
  workflow_dispatch:

  schedule:
    # Tous les jours à 06h00 UTC
    - cron: "0 6 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.3.3"

      - name: Setup Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libfontconfig1-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            libfreetype6-dev \
            libpng-dev \
            libtiff5-dev \
            libjpeg-dev \
            libuv1-dev

      - name: Install R packages
        run: |
          Rscript -e 'install.packages(c(
            "rmarkdown",
            "knitr",
            "kableExtra",
            "glue",
            "scales",
            "tseries",
      
            "tidyverse",
            "janitor",
            "slider",
            "tidymodels",
            "corrplot",
      
            "ranger",
            "xgboost",
            "plumber"
          ), repos="https://cloud.r-project.org")'

      - name: Create docs directory
        run: |
          mkdir -p docs

      - name: Build HTML report
        run: |
          Rscript -e 'rmarkdown::render(
            "reports/rapport_final_prediction_ventes_pharma.Rmd",
            output_file = "index.html",
            output_dir = "docs",
            envir = new.env()
          )'

      - name: Commit generated report
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/index.html

          if git diff --cached --quiet; then
            echo "Aucune modification du rapport."
          else
            git commit -m "Mise à jour automatique du rapport"
            git push
          fi
