name: Build and Publish Report

on:
  workflow_dispatch:

  schedule:
    # Tous les jours à 06h00 UTC
    - cron: "0 6 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-report:
    runs-on: ubuntu-latest

    steps:

      # ========================================================================
      # 1. Récupération du dépôt
      # ========================================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ========================================================================
      # 2. Installation de R
      # ========================================================================

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.3.3"
          use-public-rspm: true


      # ========================================================================
      # 3. Installation de Pandoc
      # ========================================================================

      - name: Setup Pandoc
        uses: r-lib/actions/setup-pandoc@v2


      # ========================================================================
      # 4. Dépendances R + cache automatique
      # ========================================================================

      - name: Setup R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache-version: 1

          packages: |
            any::rmarkdown
            any::knitr
            any::kableExtra
            any::glue
            any::scales
            any::tseries

            any::tidyverse
            any::janitor
            any::slider
            any::tidymodels
            any::corrplot

            any::ranger
            any::xgboost
            any::plumber


      # ========================================================================
      # 5. Vérification des packages essentiels
      # ========================================================================

      - name: Check required R packages
        run: |
          Rscript -e '
          packages <- c(
            "rmarkdown",
            "knitr",
            "kableExtra",
            "glue",
            "scales",
            "tseries",
            "tidyverse",
            "janitor",
            "slider",
            "tidymodels",
            "corrplot",
            "ranger",
            "xgboost",
            "plumber"
          )

          manquants <- packages[
            !vapply(
              packages,
              requireNamespace,
              quietly = TRUE,
              FUN.VALUE = logical(1)
            )
          ]

          if(length(manquants) > 0){
            stop(
              paste(
                "Packages manquants :",
                paste(manquants, collapse = ", ")
              )
            )
          }

          cat("Tous les packages R requis sont disponibles.\n")
          '


      # ========================================================================
      # 6. Création du dossier GitHub Pages
      # ========================================================================

      - name: Create docs directory
        run: |
          mkdir -p docs


      # ========================================================================
      # 7. Génération du rapport
      # ========================================================================

      - name: Build HTML report
        run: |
          Rscript -e '
          rmarkdown::render(
            input = "reports/rapport_final_prediction_ventes_pharma.Rmd",
            output_file = "index.html",
            output_dir = "docs",
            envir = new.env()
          )
          '


      # ========================================================================
      # 8. Vérification du HTML
      # ========================================================================

      - name: Check generated report
        run: |
          test -f docs/index.html

          echo "Rapport généré :"
          ls -lh docs/index.html


      # ========================================================================
      # 9. Publication automatique dans GitHub
      # ========================================================================

      - name: Commit generated report
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/index.html

          if git diff --cached --quiet; then

            echo "Aucune modification du rapport."

          else

            git commit -m "Mise à jour automatique du rapport"

            git pull --rebase origin main

            git push origin main

          fi
